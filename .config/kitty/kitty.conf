color3                  #d79921
color11                 #fabd2f
# blue
color4                  #005577
color12                 #458588
# magenta
color5                  #b16286
color13                 #d3869b
# cyan
color6                  #689d6a
color14                 #8ec07c
# white
color7                  #a89984
color15                 #ebdbb2

# ─── splits ────────────────────────────────────────────────
active_border_color     #005577
inactive_border_color   #333333
