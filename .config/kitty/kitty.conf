# ─── font ──────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.0

disable_ligatures never
modify_font cell_height 108%

# ─── window ────────────────────────────────────────────────
# Matches the 12px inner padding of the wofi panel.
window_padding_width      12
background_opacity        1.0
dynamic_background_opacity no
hide_window_decorations   yes
confirm_os_window_close   0

# Hyprland draws the rounded corners + blur; kitty just supplies the tint.
window_border_width     0
draw_minimal_borders    yes

# ─── cursor ────────────────────────────────────────────────
cursor                  #005577
cursor_text_color       #eeeeee
cursor_shape            block
cursor_blink_interval   0
cursor_trail            0

# ─── scrollback / mouse ────────────────────────────────────
scrollback_lines        10000
mouse_hide_wait         2.0
url_color               #005577
url_style               curly
copy_on_select          no
strip_trailing_spaces   smart

# ─── bell ──────────────────────────────────────────────────
enable_audio_bell       no
visual_bell_duration    0

# ─── tab bar ───────────────────────────────────────────────
tab_bar_edge            top
tab_bar_style           fade
tab_bar_min_tabs        2
tab_bar_margin_width    0.0
tab_bar_margin_height   0.0 0.0
tab_title_template      " {index}: {title[:15]} "

active_tab_background   #005577
active_tab_foreground   #eeeeee
active_tab_font_style   bold
inactive_tab_background #222222
inactive_tab_foreground #777777
inactive_tab_font_style normal
tab_bar_background      #111111

# ─── palette ───────────────────────────────────────────────
# Same ground as the waybar pills and the wofi panel (#181820),
# Suckless / dwm palette
foreground              #d0d0d0
background              #1c1c1c
selection_foreground    #ffffff
selection_background    #005577

# black
color0                  #222222
color8                  #444444
# red
color1                  #cc241d
color9                  #fb4934
# green
color2                  #98971a
color10                 #b8bb26
