# ─── font ──────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.0

disable_ligatures never
modify_font cell_height 108%

# ─── window ────────────────────────────────────────────────
# Matches the 12px inner padding of the wofi panel.
window_padding_width      12
background_opacity        1.0
dynamic_background_opacity no
hide_window_decorations   yes
confirm_os_window_close   0

# Hyprland draws the rounded corners + blur; kitty just supplies the tint.
window_border_width     0
draw_minimal_borders    yes

# ─── cursor ────────────────────────────────────────────────
cursor                  #ffffff
cursor_text_color       #000000
cursor_shape            block
cursor_blink_interval   0
cursor_trail            0

# ─── scrollback / mouse ────────────────────────────────────
scrollback_lines        10000
mouse_hide_wait         2.0
url_color               #00e5ff
url_style               curly
copy_on_select          no
strip_trailing_spaces   smart

# ─── bell ──────────────────────────────────────────────────
enable_audio_bell       no
visual_bell_duration    0

# ─── tab bar ───────────────────────────────────────────────
tab_bar_edge            top
tab_bar_style           fade
tab_bar_min_tabs        2
tab_bar_margin_width    0.0
tab_bar_margin_height   0.0 0.0
tab_title_template      " {index}: {title[:15]} "

active_tab_background   #ffffff
active_tab_foreground   #000000
active_tab_font_style   bold
inactive_tab_background #000000
inactive_tab_foreground #888888
inactive_tab_font_style normal
tab_bar_background      #000000

# ─── palette ───────────────────────────────────────────────
# High-contrast pure black & white palette
foreground              #ffffff
background              #000000
selection_foreground    #000000
selection_background    #ffffff

# black
color0                  #000000
color8                  #555555
# red
color1                  #ff5555
color9                  #ff6e6e
# green
color2                  #50fa7b
color10                 #69ff94
# yellow
color3                  #f1fa8c
color11                 #ffffa5
# blue
color4                  #8be9fd
color12                 #a4ffff
# magenta
color5                  #ff79c6
color13                 #ff92df
# cyan
color6                  #00e5ff
color14                 #18ffff
# white
color7                  #e0e0e0
color15                 #ffffff

# ─── splits ────────────────────────────────────────────────
active_border_color     #ffffff
inactive_border_color   #282828
