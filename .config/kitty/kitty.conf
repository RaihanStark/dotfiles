# ─── font ──────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.0

disable_ligatures never
modify_font cell_height 108%

# ─── window ────────────────────────────────────────────────
# Matches the 12px inner padding of the wofi panel.
window_padding_width      12
background_opacity        1.0
dynamic_background_opacity no
hide_window_decorations   yes
confirm_os_window_close   0

# Hyprland draws the rounded corners + blur; kitty just supplies the tint.
window_border_width     0
draw_minimal_borders    yes

# ─── cursor ────────────────────────────────────────────────
cursor                  #89b4fa
cursor_text_color       #181820
cursor_shape            beam
cursor_beam_thickness   1.6
cursor_blink_interval   0
cursor_trail            0

# ─── scrollback / mouse ────────────────────────────────────
scrollback_lines        10000
mouse_hide_wait         2.0
url_color               #89b4fa
url_style               curly
copy_on_select          no
strip_trailing_spaces   smart

# ─── bell ──────────────────────────────────────────────────
enable_audio_bell       no
visual_bell_duration    0

# ─── tab bar (echoes the waybar workspace pills) ───────────
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     round
tab_bar_min_tabs        2
tab_bar_margin_width    0.0
tab_bar_margin_height   6.0 0.0
tab_title_template      " {index} "

active_tab_background   #89b4fa
active_tab_foreground   #181820
active_tab_font_style   bold
inactive_tab_background #1e1e2e
inactive_tab_foreground #7f849c
inactive_tab_font_style normal
tab_bar_background      none

# ─── palette ───────────────────────────────────────────────
# Same ground as the waybar pills and the wofi panel (#181820),
# completed into a full 16-colour set.
foreground              #cdd6f4
background              #181820
selection_foreground    #181820
selection_background    #89b4fa

# black
color0                  #45475a
color8                  #585b70
# red
color1                  #f38ba8
color9                  #f38ba8
# green
color2                  #a6e3a1
color10                 #a6e3a1
# yellow
color3                  #f9e2af
color11                 #f9e2af
# blue
color4                  #89b4fa
color12                 #89b4fa
# magenta
color5                  #f5c2e7
color13                 #f5c2e7
# cyan
color6                  #94e2d5
color14                 #94e2d5
# white
color7                  #bac2de
color15                 #a6adc8

# ─── splits ────────────────────────────────────────────────
active_border_color     #89b4fa
inactive_border_color   #313244
