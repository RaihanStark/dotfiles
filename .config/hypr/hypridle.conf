# Hypridle configuration
# Screen turns off to black after 15 minutes of inactivity.
# No sleep/suspend, no lock screen.
# Mouse movement or keyboard activity turns the screen back on immediately.

general {
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

listener {
    timeout = 900                                                 # 15 minutes (900 seconds)
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})' # turn off screen to black
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'   # turn on screen when activity is detected
}
