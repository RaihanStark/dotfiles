# Hypridle configuration
# Screen turns off to black after 15 minutes of inactivity.
# No sleep/suspend, no lock screen.
# Mouse movement or keyboard activity turns the screen back on immediately.

general {
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 1. Dim screen to 10% after 2.5 minutes of inactivity (saves backlight power)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 2. Turn off display completely after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
