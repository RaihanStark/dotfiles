# NOTE: hyprpaper 0.8.4 does not read this file (verified: an invalid key
# here produces no parse error, with or without -c). The wallpaper is
# applied over IPC by ~/.config/hypr/wallpaper.sh, which hyprland autostarts.
# Kept so a future hyprpaper that honours it picks the same image.
preload = /home/han/Pictures/wallpapers/zero.jpg
wallpaper = ,/home/han/Pictures/wallpapers/zero.jpg

splash = false
ipc = on
