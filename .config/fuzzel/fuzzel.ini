# Fuzzel configuration - High-Contrast Suckless Theme

font=JetBrainsMono Nerd Font:size=12
dpi-aware=yes
use-bold=yes
prompt="❯ "
terminal=kitty -e
layer=overlay
lines=10
width=40
tabs=4
horizontal-pad=16
vertical-pad=12
inner-pad=8
line-height=26
fields=filename,name,generic,exec,categories,keywords

[colors]
background=000000ff
text=d0d0d0ff
prompt=ffffffff
placeholder=777777ff
input=ffffffff
match=ffffffff
selection=ffffffff
selection-text=000000ff
selection-match=000000ff
border=ffffffff

[border]
width=2
radius=0
