<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Generic aliases resolved to FreeMono/FreeSans by default, which is why
       anything asking for plain "monospace" got FreeMono instead of the rice
       font. Point them at the fonts actually installed here. -->

  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>FreeSerif</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Font Awesome ships glyphs at real emoji codepoints (U+1F600 etc.) and
       outranks Noto Color Emoji in fallback order, so emoji would render as
       Font Awesome's monochrome shapes. Bind the colour font strongly to every
       pattern so it wins the fallback. -->
  <match target="pattern">
    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

</fontconfig>
