format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

right_format = "$time"
add_newline = false

palette = "suckless"

[palettes.suckless]
bg     = "#1c1c1c"
fg     = "#d0d0d0"
muted  = "#777777"
accent = "#005577"
cyan   = "#458588"
green  = "#98971a"
yellow = "#d79921"
red    = "#cc241d"

[directory]
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = false

[character]
success_symbol = "[λ](bold cyan) "
error_symbol = "[λ](bold red) "
vimcmd_symbol = "[❮](bold green) "

[git_branch]
symbol = "git:"
style = "yellow"
format = "[$symbol$branch]($style) "

[git_status]
style = "muted"
format = "[$all_status$ahead_behind]($style) "

[time]
disabled = false
format = "[$time]($style)"
style = "muted"
time_format = "%T"
