# ~/.config/starship.toml
# Catppuccin Mocha Clean (2-line, rich Git state/counts/metrics + language runtimes)

palette = "catppuccin_mocha"
add_newline = true
command_timeout = 500

format = """
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$git_metrics\
$golang\
$rust\
$nodejs\
$python\
$lua\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[λ](bold green) "
error_symbol = "[λ](bold red) "
vimcmd_symbol = "[λ](bold mauve) "

[directory]
style = "bold blue"
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "bold red"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold mauve"
format = "on [$symbol$branch(:$remote_branch)]($style) "

[git_commit]
commit_hash_length = 7
style = "bold peach"
format = '[\($hash$tag\)]($style) '
tag_disabled = false
tag_symbol = " 🏷 "

[git_state]
style = "bold yellow"
format = '\([$state( $progress_current/$progress_total)]($style)\) '
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"

[git_status]
format = '($ahead_behind$staged$modified$untracked$deleted$renamed$conflicted$stashed)'
conflicted = "[=${count}](bold red) "
ahead = "[⇡${count}](bold green) "
behind = "[⇣${count}](bold yellow) "
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](bold peach) "
untracked = "[?${count}](bold sapphire) "
stashed = "[≡${count}](bold teal) "
modified = "[!${count}](bold yellow) "
staged = "[+${count}](bold green) "
renamed = "[»${count}](bold lavender) "
deleted = "[✘${count}](bold red) "

[git_metrics]
disabled = false
added_style = "dimmed green"
deleted_style = "dimmed red"
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'

[golang]
symbol = " "
style = "bold sapphire"
format = "via [$symbol($version )]($style)"

[rust]
symbol = "󱘗 "
style = "bold peach"
format = "via [$symbol($version )]($style)"

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version )]($style)"

[python]
symbol = " "
style = "bold yellow"
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[lua]
symbol = " "
style = "bold blue"
format = "via [$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "bold sapphire"
format = "via [$symbol$context]($style) "

[cmd_duration]
min_time = 2000
style = "bold yellow"
format = "took [$duration]($style) "

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
