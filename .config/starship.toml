# ~/.config/starship.toml
# Suckless-inspired high-contrast monochrome prompt (0ms latency overhead)

# Only print essential information: Directory, Git Branch, Status, Prompt Character
format = """
$directory\
$git_branch\
$git_status\
$character"""

# Add a newline between commands for readability
add_newline = true

# Timeout aggressively so commands never hitch on slow filesystems/repos
command_timeout = 200

[character]
success_symbol = "[λ](bold white) "
error_symbol = "[λ](bold red) "
vimcmd_symbol = "[V](bold black) "

[directory]
style = "bold white"
read_only = " [RO]"
read_only_style = "bold black"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = ""
style = "bold black"
format = " on [$branch]($style)"

[git_status]
style = "bold white"
format = "([$all_status$ahead_behind]($style))"
conflicted = "="
ahead = ">"
behind = "<"
diverged = "<>"
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "x"
