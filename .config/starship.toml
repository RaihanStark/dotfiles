format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

right_format = "$time"
add_newline = false

[directory]
style = "bold white"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = false

[character]
success_symbol = "[❯](bold white) "
error_symbol = "[❯](bold red) "
vimcmd_symbol = "[❮](bold green) "

[git_branch]
symbol = "git:"
style = "bold yellow"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "[$all_status$ahead_behind]($style) "

[time]
disabled = false
format = "[$time]($style)"
style = "bold white"
time_format = "%T"
