# Foot Terminal — High-Contrast Suckless Monochrome Configuration

font=JetBrainsMono Nerd Font:size=11
pad=12x12

[bell]
urgent=yes
notify=no

[scrollback]
lines=10000

[cursor]
style=block
blink=no

[colors-dark]
background=000000
foreground=ffffff
selection-foreground=000000
selection-background=ffffff
cursor=000000 ffffff

# Regular colors
regular0=000000  # black
regular1=ff5555  # red
regular2=50fa7b  # green
regular3=f1fa8c  # yellow
regular4=8be9fd  # blue
regular5=ff79c6  # magenta
regular6=00e5ff  # cyan
regular7=e0e0e0  # white

# Bright colors
bright0=555555   # bright black
bright1=ff6e6e   # bright red
bright2=69ff94   # bright green
bright3=ffffa5   # bright yellow
bright4=a4ffff   # bright blue
bright5=ff92df   # bright magenta
bright6=18ffff   # bright cyan
bright7=ffffff   # bright white
